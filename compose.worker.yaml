name: cadpilot-${CADPILOT_INSTANCE_ID:?Generate a connection command in onboarding}
services:
  cad:
    build:
      context: .
      dockerfile: harness/docker/Dockerfile
    image: cadpilot:paired
    platform: linux/amd64
    init: true
    restart: unless-stopped
    command: [uvicorn, 'server.app:app', --host, '127.0.0.1', --port, '7800', --no-proxy-headers]
    environment:
      CADPILOT_AUTH_ENABLED: '0'
      CADPILOT_NATIVE_OPERATIONS: '1'
      CADPILOT_PORTAL_URL: ${CADPILOT_PORTAL_URL:?Missing portal URL}
      CADPILOT_INSTANCE_ID: ${CADPILOT_INSTANCE_ID}
      CADPILOT_PAIRING_TOKEN: ${CADPILOT_PAIRING_TOKEN:?Missing pairing token}
      CADPILOT_SEARXNG_URL: http://searxng:8080
      CADPILOT_MODEL_BASE_URL: http://host.docker.internal:8000/v1
    extra_hosts: [host.docker.internal:host-gateway]
    # Public portal DNS must resolve inside an IPv4 Docker network too.
    dns: ["${CADPILOT_DNS_PRIMARY:-1.1.1.1}", "${CADPILOT_DNS_SECONDARY:-1.0.0.1}"]
    volumes:
      - projects:/opt/cadpilot/harness/projects
      - state:/opt/cadpilot/harness/state
      - knowledge:/opt/cadpilot/harness/knowledge
    shm_size: 1gb
    cap_drop: [ALL]
    # Required for nested unprivileged bubblewrap and Chromium namespaces.
    security_opt: [seccomp=unconfined, apparmor=unconfined, systempaths=unconfined, no-new-privileges:true]
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7800/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
  searxng:
    image: docker.io/searxng/searxng@sha256:2f3d065068121ea3e366104b409d8a16ba10d9eb95a104dd94c63ccaad64cbc3
    restart: unless-stopped
    volumes:
      - ${CADPILOT_WORKSPACE_DIR:?Run harness/connect.sh}/searxng:/etc/searxng:ro
      - search_cache:/var/cache/searxng
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  projects:
  state:
  knowledge:
  search_cache:
