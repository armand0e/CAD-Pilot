name: cadpilot
services:
  cad:
    build:
      context: .
      dockerfile: harness/docker/Dockerfile
    image: cadpilot:local
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CADPILOT_PORT:-7801}:7800"
    environment:
      CADPILOT_AUTH_ENABLED: "1"
      CADPILOT_OWNER: ${CADPILOT_OWNER:-admin}
      CADPILOT_PASSWORD_FILE: /run/secrets/owner_password
      CADPILOT_MODEL_BASE_URL: ${CADPILOT_MODEL_BASE_URL:-http://host.docker.internal:8000/v1}
      CADPILOT_MODEL: ${CADPILOT_MODEL:-qwen3.8-27b}
      CADPILOT_SEARXNG_URL: http://searxng:8080
      CADPILOT_NATIVE_OPERATIONS: ${CADPILOT_NATIVE_OPERATIONS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - owner_password
    volumes:
      - projects:/opt/cadpilot/harness/projects
      - state:/opt/cadpilot/harness/state
      - knowledge:/opt/cadpilot/harness/knowledge
    shm_size: 1gb
    cap_drop: [ALL]
    # Nested unprivileged namespaces are used by bubblewrap and Chromium.
    # The process remains UID 1000 with no host mounts, Docker socket or capabilities.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
      - no-new-privileges:true
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7800/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng@sha256:2f3d065068121ea3e366104b409d8a16ba10d9eb95a104dd94c63ccaad64cbc3}
    restart: unless-stopped
    volumes:
      - ./harness/.docker/searxng:/etc/searxng:ro
      - search_cache:/var/cache/searxng
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  projects:
  state:
  knowledge:
  search_cache:
secrets:
  owner_password:
    file: ./harness/.docker/owner-password
